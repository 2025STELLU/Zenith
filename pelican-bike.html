<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);

  /* ---------- 几何常量 ---------- */
  const R = 60;                       // 车轮半径
  const GROUND_Y = 460;
  const REAR = { x: 298, y: 400 };
  const FRONT = { x: 492, y: 400 };
  const BB = { x: 392, y: 402 };      // 中轴
  const CRANK = 30;                   // 曲柄长度
  const HIP = { x: 338, y: 294 };     // 髋关节（车座上）
  const L1 = 82, L2 = 82;             // 大腿 / 小腿

  const SPEED = 300;                  // 世界移动速度 px/s

  /* ---------- 生成车轮辐条 ---------- */
  function buildSpokes(g, c) {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', c.x + Math.cos(a) * 9);
      line.setAttribute('y1', c.y + Math.sin(a) * 9);
      line.setAttribute('x2', c.x + Math.cos(a) * 52);
      line.setAttribute('y2', c.y + Math.sin(a) * 52);
      g.appendChild(line);
    }
  }
  buildSpokes($('spokesRear'), REAR);
  buildSpokes($('spokesFront'), FRONT);

  /* ---------- 链条路径（两圆外公切线） ---------- */
  function chainPath(c1, r1, c2, r2) {
    const dx = c2.x - c1.x, dy = c2.y - c1.y;
    const d = Math.hypot(dx, dy);
    const th = Math.atan2(dy, dx);
    const al = Math.acos(Math.max(-1, Math.min(1, (r1 - r2) / d)));
    const p = (c, r, a) => ({ x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) });
    const a1 = p(c1, r1, th + al), b1 = p(c2, r2, th + al);
    const a2 = p(c1, r1, th - al), b2 = p(c2, r2, th - al);
    return `M ${a1.x} ${a1.y} L ${b1.x} ${b1.y} ` +
           `A ${r2} ${r2} 0 0 1 ${b2.x} ${b2.y} ` +
           `L ${a2.x} ${a2.y} A ${r1} ${r1} 0 0 1 ${a1.x} ${a1.y}`;
  }
  $('chain').setAttribute('d', chainPath(BB, 22, REAR, 8));

  /* ---------- 两段式 IK ---------- */
  function solveIK(hip, foot, l1, l2, bend) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    const maxD = l1 + l2 - 0.5;
    const minD = Math.abs(l1 - l2) + 0.5;
    d = Math.max(minD, Math.min(maxD, d));
    const base = Math.atan2(dy, dx);
    const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const a = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const ang = base + bend * a;
    return { x: hip.x + Math.cos(ang) * l1, y: hip.y + Math.sin(ang) * l1 };
  }

  /* ---------- 围巾 ---------- */
  function scarfPath(t) {
    const n = 20, len = 124;
    const top = [], bot = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const x = 376 - u * len;
      // 从颈部向后飘：整条带子上扬，越靠末端摆动越大
      const y = 197 - u * 34 - u * u * 10 + Math.sin(t * 7.4 - u * 5.8) * 14 * u * u;
      const w = 10 * (1 - u * 0.55);
      top.push([x, y - w]);
      bot.push([x, y + w]);
    }
    const f = p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
    let d = `M ${f(top[0])}`;
    for (let i = 1; i <= n; i++) d += ` L ${f(top[i])}`;
    d += ` Q ${(top[n][0] - 7).toFixed(1)} ${((top[n][1] + bot[n][1]) / 2).toFixed(1)} ${f(bot[n])}`;
    for (let i = n - 1; i >= 0; i--) d += ` L ${f(bot[i])}`;
    return d + ' Z';
  }

  // 围巾内侧高光
  function scarfHighlight(t) {
    const n = 20, len = 124;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const x = 376 - u * len;
      const y = 197 - u * 34 - u * u * 10 + Math.sin(t * 7.4 - u * 5.8) * 14 * u * u;
      const w = 10 * (1 - u * 0.55);
      pts.push(`${x.toFixed(1)} ${(y - w * 0.32).toFixed(1)}`);
    }
    return 'M ' + pts.join(' L ');
  }

  /* ---------- 元素引用 ---------- */
  const rig = $('rig');
  const wheelRear = $('wheelRear');
  const wheelFront = $('wheelFront');
  const crankNear = $('crankNear');
  const crankFar = $('crankFar');
  const pedalNear = $('pedalNear');
  const pedalFar = $('pedalFar');
  const legNear = $('legNear');
  const legFar = $('legFar');
  const footNear = $('footNear');
  const footFar = $('footFar');
  const scarf = $('scarf');
  const scarfLine = $('scarfLine');
  const eye = $('eye');
  const headGroup = $('headGroup');
  const pouch = $('pouch');
  const wingBody = $('wingBody');
  const tail = $('tail');
  const chain = $('chain');
  const shadow = $('groundShadow');
  const sunRays = $('sunRays');
  const speedLines = $('speedLines');
  const pClouds = $('pClouds');
  const pHillFar = $('pHillFar');
  const pHillNear = $('pHillNear');
  const pRoad = $('pRoad');
  const pGrass = $('pGrass');

  /* ---------- 渲染一帧 ---------- */
  const DEG = 180 / Math.PI;
  const BEND_NEAR = -1, BEND_FAR = -1;

  function setLeg(pathEl, footEl, hip, pedal, bend, legAngle) {
    const knee = solveIK(hip, pedal, L1, L2, bend);
    pathEl.setAttribute('d',
      `M ${hip.x} ${hip.y} L ${knee.x.toFixed(2)} ${knee.y.toFixed(2)} ` +
      `L ${pedal.x.toFixed(2)} ${pedal.y.toFixed(2)}`);
    footEl.setAttribute('transform',
      `translate(${(pedal.x + 2).toFixed(2)} ${(pedal.y - 2).toFixed(2)}) rotate(${legAngle.toFixed(1)})`);
  }

  function render(t) {
    /* 车轮：转动与地速一致 */
    const wheelDeg = (-t * SPEED / R) * DEG;
    wheelRear.setAttribute('transform', `rotate(${wheelDeg % 360} 298 400)`);
    wheelFront.setAttribute('transform', `rotate(${wheelDeg % 360} 492 400)`);

    /* 曲柄：顺时针。齿比让踏频快于车轮转速 */
    const crank = t * (SPEED / R) * 0.78;
    const pn = { x: BB.x + Math.cos(crank) * CRANK, y: BB.y + Math.sin(crank) * CRANK };
    const pf = { x: BB.x - Math.cos(crank) * CRANK, y: BB.y - Math.sin(crank) * CRANK };

    crankNear.setAttribute('x2', pn.x.toFixed(2));
    crankNear.setAttribute('y2', pn.y.toFixed(2));
    crankFar.setAttribute('x2', pf.x.toFixed(2));
    crankFar.setAttribute('y2', pf.y.toFixed(2));

    pedalNear.setAttribute('transform', `translate(${pn.x.toFixed(2)} ${pn.y.toFixed(2)})`);
    pedalFar.setAttribute('transform', `translate(${pf.x.toFixed(2)} ${pf.y.toFixed(2)})`);

    /* 腿：脚踩在踏板上 */
    const hipBob = Math.sin(t * 2.6) * 1.5;
    const hip = { x: HIP.x, y: HIP.y + hipBob };
    const footN = { x: pn.x + 2, y: pn.y - 3 };
    const footF = { x: pf.x + 2, y: pf.y - 3 };
    setLeg(legNear, footNear, hip, footN, BEND_NEAR, Math.sin(crank) * 10);
    setLeg(legFar, footFar, hip, footF, BEND_FAR, Math.sin(crank + Math.PI) * 10);

    /* 链条滚动 */
    chain.setAttribute('stroke-dashoffset', (-t * 46) % 9);

    /* 整体起伏 */
    const bob = Math.sin(t * 2.6) * 2.2;
    const tilt = Math.sin(t * 2.6 + 0.9) * 0.45 + 0.6;
    rig.setAttribute('transform',
      `translate(0 ${bob.toFixed(2)}) rotate(${tilt.toFixed(2)} 392 ${GROUND_Y})`);

    /* 阴影随起伏缩放 */
    const sh = 1 + Math.sin(t * 2.6) * 0.02;
    shadow.setAttribute('transform', `translate(396 464) scale(${sh.toFixed(3)} 1) translate(-396 -464)`);

    /* 头部微小晃动 */
    headGroup.setAttribute('transform',
      `rotate(${(Math.sin(t * 1.7) * 1.8 + Math.sin(t * 2.6 + 0.6) * 1.2).toFixed(2)} 398 172)`);

    /* 喉囊晃动（软体感） */
    const pouchWob = Math.sin(t * 4.2) * 0.9 + Math.sin(t * 2.6 + 1.4) * 0.7;
    pouch.setAttribute('transform', `rotate(${pouchWob.toFixed(2)} 444 146)`);

    /* 翅膀轻拍 */
    wingBody.setAttribute('transform', `rotate(${(Math.sin(t * 3.1) * 1.6).toFixed(2)} 352 214)`);
    tail.setAttribute('transform', `rotate(${(Math.sin(t * 3.1 + 1.2) * 2.4).toFixed(2)} 274 264)`);

    /* 眨眼 */
    const cyc = 4.4;
    const ph = t % cyc;
    let lid = 1;
    if (ph > cyc - 0.16) {
      const k = (ph - (cyc - 0.16)) / 0.16;
      lid = Math.max(0.08, Math.abs(Math.cos(k * Math.PI)));
    }
    eye.setAttribute('transform',
      `translate(430 129) scale(1 ${lid.toFixed(3)}) translate(-430 -129)`);

    /* 围巾飘动 */
    scarf.setAttribute('d', scarfPath(t));
    scarfLine.setAttribute('d', scarfHighlight(t));

    /* 背景视差 */
    const wrap = (v, p) => -(((v % p) + p) % p);
    pClouds.setAttribute('patternTransform', `translate(${wrap(t * 16, 900)} 0)`);
    pHillFar.setAttribute('patternTransform', `translate(${wrap(t * 48, 900)} 0)`);
    pHillNear.setAttribute('patternTransform', `translate(${wrap(t * 104, 900)} 0)`);
    pGrass.setAttribute('patternTransform', `translate(${wrap(t * SPEED, 900)} 0)`);
    pRoad.setAttribute('patternTransform', `translate(${wrap(t * SPEED, 140)} 0)`);

    /* 太阳光芒 */
    sunRays.setAttribute('transform', `rotate(${(t * 8) % 360} 762 88)`);

    /* 速度线循环 */
    const sp = (t * 1.6) % 1;
    speedLines.setAttribute('opacity', (0.45 * (1 - sp)).toFixed(3));
    speedLines.setAttribute('transform',
      `translate(${(-sp * 40).toFixed(2)} 0)`);
  }

  /* ---------- 主循环 ---------- */
  let t = 0;
  let last = 0;
  let paused = false;
  let speed = 1;

  const reduce = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) speed = 0.25;

  function loop(now) {
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) t += dt * speed;
    render(t);
    requestAnimationFrame(loop);
  }

  function toggle() { paused = !paused; }
  window.addEventListener('click', toggle);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
  });

  render(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
